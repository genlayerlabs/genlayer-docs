# Clarke network configuration (GenLayer public testnet on the Bradbury rollup, chain id 4221).
#
# Put these values into configs/node/config.yaml, and save the Clarke protocol
# manifest (clarke.protocol-manifest.json) as configs/node/protocol-manifest.json.
# They come from the genlayer-consensus deployment record
# deployments/clarke.json and its sealed protocol manifest.

# rollup configuration
rollup:
  genlayerchainrpcurl: "https://rpc.testnet-chain.genlayer.com/" # GenLayer Chain RPC URL
  genlayerchainwebsocketurl: "wss://rpc.testnet-chain.genlayer.com/" # GenLayer Chain WebSocket URL
  # The WebSocket refuses a connection without an API key. The chain is
  # operated by Conduit: create a key at https://app.conduit.xyz/rpc-keys and
  # set it in the environment as
  # GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCKEY (or in the file that
  # genlayerchainrpckeyfile names), never in these URLs or this file.
  # The node sends it in the X-AccessKey header on the RPC and WebSocket
  # connections.
  provider: "conduit" # Rollup operator name; surfaces as the "provider" label on RPC-driven metrics.

# consensus contracts configuration
consensus:
  consensusaddress: "0xA79dA7c238905fD0F10298cD579B0733ad1B1d0E" # AddressManager contract address. Shares chain 4221 with Bradbury Phase 3: the address is what selects Clarke.
  chainid: "4221" # DECIMAL chain id of this deployment.
  manifestpath: "configs/node/protocol-manifest.json" # Where clarke.protocol-manifest.json is saved; a relative path resolves against the node root.
  genesis: 713692 # Genesis block number for this consensus deployment (AddressManager deployment block).

# node configuration
# Add this one key to the node: section you already have. Do not replace the
# whole section: it also holds your mode and validator wallet address.
node:
  network: "clarke" # Network name for logs, metrics, the ops API and doctor messages. Node v0.6.1 does not detect Clarke from the AddressManager address, so set it here.

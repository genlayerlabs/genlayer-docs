services:
  webdriver-container:
    container_name: genlayer-node-webdriver
    image: yeagerai/genlayer-genvm-webdriver:0.0.12
    shm_size: 2gb
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 4444
    ports:
      - "${WEBDRIVER_PORT:-4444}:4444"
    restart: unless-stopped

  # docker-socket-proxy — hardened, read-only Docker API gateway used ONLY so the
  # node can read the WebDriver container's resource stats (CPU/memory/traffic) for
  # metrics. Runs with the `node` OR `monitoring` profile, so it comes up alongside
  # a node container AND alongside a monitoring/telemetry bring-up — the latter is
  # how a binary/systemd node (node not containerized) gets its webdriver metrics.
  #
  # WHY THIS EXISTS — and why it is NOT a new exposure or a "leak":
  #   Reading container stats requires the Docker API. Previously the node reached
  #   the host /var/run/docker.sock directly (bind-mounted into the container, or via
  #   docker-group membership for a binary node) — but that grants the FULL Docker
  #   API as root (a `:ro` flag does NOT restrict API calls), so a node compromise
  #   could escalate to host root. This proxy REPLACES that: it is the only thing
  #   touching the socket, restricted to read-only container endpoints (CONTAINERS=1;
  #   POST=0 => it returns 403 for create / exec / images / everything else). Net
  #   exposure goes DOWN, not up.
  #     - Published ONLY on 127.0.0.1:2375 (host loopback), never 0.0.0.0: 2375 is
  #       the unauthenticated Docker API, so it must not leave the host. A container
  #       node reaches it over the compose network (tcp://docker-socket-proxy:2375);
  #       a binary/systemd node reaches it on the host (tcp://127.0.0.1:2375).
  #     - Standard, widely-audited image (tecnativa/docker-socket-proxy).
  #
  # The node points DOCKER_HOST at this proxy and NEVER falls back to the host
  # socket: if DOCKER_HOST is unset the node skips webdriver metrics entirely
  # (non-fatal). Note those are the webdriver container's CPU/memory/traffic series
  # (genlayer_node_*{component="webdriver"}) that feed validator resource dashboards —
  # so keep DOCKER_HOST set to keep those panels populated. To disable metrics
  # instead: set metrics.collectors.webdriver.enabled: false and delete this service.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: genlayer-node-docker-proxy
    environment:
      CONTAINERS: 1   # GET /containers/{json,inspect,stats} — read-only via POST=0
      VERSION: 1      # required by the Docker client's API-version negotiation
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Loopback ONLY (never 0.0.0.0) — 2375 is the unauthenticated Docker API and
      # must not be exposed beyond the host. Lets a binary/systemd node reach the
      # proxy at tcp://127.0.0.1:2375; container nodes use the service name instead.
      - "127.0.0.1:2375:2375"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/version"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles:
      - node
      - monitoring

  genlayer-node:
    image: yeagerai/genlayer-node:${NODE_VERSION:-latest}
    # The keystore password is NOT on this command line. It reaches the node as
    # GENLAYERNODE_PASSWORD (environment below), which the run command reads in
    # place of --password. A command-line argument is visible in process
    # listings on the host; an environment variable is not.
    entrypoint: ["/app/bin/genlayernode", "run"]
    container_name: genlayer-node
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      # ":?" makes Compose refuse to start when NODE_PASSWORD is unset or empty,
      # before any container runs. There is no fallback: this is the password
      # that encrypts the validator's signing key, and a default shared by every
      # operator who forgot to set one is a key anyone can open. The release
      # binary carries no default either — it is compiled out of production.
      GENLAYERNODE_PASSWORD: "${NODE_PASSWORD:?NODE_PASSWORD is not set. It is the keystore password that unlocks the validator key. Set it in .env; see README section 4.}"
      # WebDriver metrics collector reaches Docker via the read-only proxy
      # (see docker-socket-proxy above), never the host socket directly.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    ports:
      - "${NODE_RPC_PORT:-9151}:9151"
      - "${NODE_OPS_PORT:-9153}:9153"
    volumes:
      - ${NODE_CONFIG_PATH:-./configs/node/config.yaml}:/app/configs/node/config.yaml:ro
      - ${NODE_DATA_PATH:-./data}:/app/data
      - ./genvm-module-web-docker.yaml:/app/opt/genvm/${GENVM_VERSION}/config/genvm-module-web.yaml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        compress: "true"
    depends_on:
      - webdriver-container
      - docker-socket-proxy
    profiles:
      - node

  # Grafana Alloy for both logs and metrics forwarding
  # Supports both single node and multi-node configurations
  #
  # Single Node Mode:
  #   Set NODE_ID, VALIDATOR_NAME, NODE_METRICS_ENDPOINT in .env
  #   docker compose --profile monitoring up -d
  #
  # Multi-Node Mode:
  #   Set SCRAPE_TARGETS_JSON in .env
  #   docker compose --profile monitoring up -d
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: genlayer-node-alloy
    # The guard runs before Alloy: with the monitoring profile up but the
    # endpoints or credentials unset, the container stops with a message
    # naming what to set, instead of half-running. Half-running is worse than
    # stopping here in both directions: pushing to a shared endpoint with a
    # shared default credential pollutes it for everyone, and pushing to an
    # unreachable one grows the WAL until the healthcheck below reads the
    # growth as a stall and deletes it. The $$ keeps compose from
    # interpolating; the shell only tests emptiness — no value ever lands on
    # a command line.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        missing="";
        [ -n "$$CENTRAL_MONITORING_URL" ]      || missing="$$missing CENTRAL_MONITORING_URL";
        [ -n "$$CENTRAL_MONITORING_USERNAME" ] || missing="$$missing CENTRAL_MONITORING_USERNAME";
        [ -n "$$CENTRAL_MONITORING_PASSWORD" ] || missing="$$missing CENTRAL_MONITORING_PASSWORD";
        [ -n "$$CENTRAL_LOKI_URL" ]            || missing="$$missing CENTRAL_LOKI_URL";
        [ -n "$$CENTRAL_LOKI_USERNAME" ]       || missing="$$missing CENTRAL_LOKI_USERNAME";
        [ -n "$$CENTRAL_LOKI_PASSWORD" ]       || missing="$$missing CENTRAL_LOKI_PASSWORD";
        if [ -n "$$missing" ]; then
        echo "ERROR: not set:$$missing" >&2;
        echo "Monitoring pushes to an endpoint YOU configure — set the CENTRAL_* values in .env (see .env.example for a localhost example)." >&2;
        exit 1;
        fi;
        exec /bin/alloy run /etc/alloy/config.river
        --server.http.listen-addr=0.0.0.0:12345
        --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy-config.river:/etc/alloy/config.river:ro
      - ./alloy-healthcheck.sh:/etc/alloy/healthcheck.sh:ro
      - ${NODE_LOGS_PATH:-./data/node/logs}:/var/log/genlayer:ro
      - alloy_data:/var/lib/alloy
    healthcheck:
      test: ["CMD", "sh", "/etc/alloy/healthcheck.sh"]
      interval: 120s
      timeout: 15s
      retries: 1
      start_period: 120s
    environment:
      # Central monitoring endpoints and credentials: NO defaults, on purpose.
      # An endpoint may be public knowledge; a credential never is, and a
      # default one ships the same key to everyone holding this file. The
      # entrypoint guard above turns "unset" into a clear stop instead of a
      # silent push to the wrong place.
      - CENTRAL_LOKI_URL=${CENTRAL_LOKI_URL:-}
      - CENTRAL_MONITORING_URL=${CENTRAL_MONITORING_URL:-}

      # Metrics (Prometheus) authentication
      - CENTRAL_MONITORING_USERNAME=${CENTRAL_MONITORING_USERNAME:-}
      - CENTRAL_MONITORING_PASSWORD=${CENTRAL_MONITORING_PASSWORD:-}

      # Logs (Loki) authentication
      - CENTRAL_LOKI_USERNAME=${CENTRAL_LOKI_USERNAME:-}
      - CENTRAL_LOKI_PASSWORD=${CENTRAL_LOKI_PASSWORD:-}

      # Single node configuration
      - NODE_ID=${NODE_ID:-validator-001}
      - VALIDATOR_NAME=${VALIDATOR_NAME:-MyValidator}
      - NODE_METRICS_ENDPOINT=${NODE_METRICS_ENDPOINT:-host.docker.internal:9153}

      # Multi-node configuration
      # When set, overrides single node config above
      - SCRAPE_TARGETS_JSON=${SCRAPE_TARGETS_JSON:-}

      # Scraping configuration
      - METRICS_SCRAPE_INTERVAL=${METRICS_SCRAPE_INTERVAL:-60s}
      - METRICS_SCRAPE_TIMEOUT=${METRICS_SCRAPE_TIMEOUT:-10s}
      - ALLOY_SELF_MONITORING_INTERVAL=${ALLOY_SELF_MONITORING_INTERVAL:-60s}

      # Log collection configuration
      - LOG_FILE_PATTERN=${LOG_FILE_PATTERN:-/var/log/genlayer/node*.log}

      # Log batching configuration
      - LOKI_BATCH_SIZE=${LOKI_BATCH_SIZE:-1MiB}
      - LOKI_BATCH_WAIT=${LOKI_BATCH_WAIT:-60s}
    ports:
      - "12345:12345"  # Alloy UI for debugging
    restart: unless-stopped
    profiles:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  alloy_data:

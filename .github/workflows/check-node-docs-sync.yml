name: Check Node Documentation Sync

on:
  pull_request:
    branches:
      - main

jobs:
  check-sync:
    name: 'Verify Node Documentation is Synced'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # check-node-sync compares the changelog with origin/main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test the setup guide version channel
        run: npm run test:setup-guide-versions

      - name: Run documentation sync scripts
        # The one generator list (.github/scripts/doc-generator.sh). Fails when a
        # generator cannot find its source or its block.
        run: npm run node-generate-all

      - name: Check synced content reaches the pages verbatim
        run: npm run check:node-sync

      - name: Check for uncommitted changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Documentation is out of sync. Please run the sync scripts locally and commit the changes."
            echo ""
            echo "Files with uncommitted changes:"
            git status --porcelain
            echo ""
            echo "Diff:"
            git diff
            exit 1
          else
            echo "Documentation is in sync."
          fi

name: Build & Publish Docs MCP Server

on:
  pull_request:
    paths:
      - "docs-mcp/**"
      - ".github/workflows/docs-mcp.yml"
  push:
    branches: [main]
    paths:
      - "docs-mcp/**"
      - "pages/**"
      - ".github/workflows/docs-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docs-mcp-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/docs-mcp-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test MCP handshake canary
        run: node --test docs-mcp/smoke-test.test.mjs

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docs-mcp
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

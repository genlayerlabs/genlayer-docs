name: Build & Publish Docs MCP Server

on:
  pull_request:
    paths:
      - "docs-mcp/**"
      - ".github/workflows/docs-mcp.yml"
  push:
    branches: [main]
    paths:
      - "docs-mcp/**"
      - "pages/**"
      - ".github/workflows/docs-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docs-mcp-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/docs-mcp-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test MCP canaries
        run: node --test docs-mcp/*.test.mjs

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docs-mcp
          push: ${{ github.event_name == 'push' }}
          build-args: |
            DOCS_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Record published release
        if: github.event_name == 'push'
        run: |
          {
            echo "### Docs MCP image published"
            echo
            echo "- Source: \`${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- GitOps: \`genlayerlabs/devexp-argocd-apps\` polls the labeled \`latest\` image and promotes this digest"
          } >> "$GITHUB_STEP_SUMMARY"

name: e2e

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright E2E
    # Pinned: ubuntu-latest is Ubuntu 26.04, where Playwright 1.55 cannot install
    # its browsers. Move back to ubuntu-latest after upgrading @playwright/test to
    # a release that supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium is used (see playwright.config.ts). Installing every
      # browser's system packages pulls ~180 apt packages, and the runner's
      # Ubuntu mirror intermittently serves them at a few KB/s, so a stalled
      # download used to consume the whole job timeout. Bound the apt step and
      # retry it once: a fresh attempt usually gets a healthy connection and
      # reuses the packages already downloaded.
      - name: Install Playwright system dependencies (Chromium)
        id: playwright-deps
        continue-on-error: true
        timeout-minutes: 8
        run: npx playwright install-deps chromium

      - name: Retry Playwright system dependencies (Chromium)
        if: steps.playwright-deps.outcome == 'failure'
        timeout-minutes: 8
        run: |
          sudo dpkg --configure -a
          npx playwright install-deps chromium

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore


